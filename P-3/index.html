<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jon Daniel — Portfolio</title>
    <link rel="stylesheet" href="style.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
</head>

<body>

    <!-- LEFT SIDEBAR NAV -->
    <nav class="sidebar">
        <ul>
            <li>Podcast</li>
            <li class="active">Portfolio</li>
            <li>Research</li>
            <li>Clients</li>
        </ul>
    </nav>

    <!-- PAGE -->
    <div class="page">

        <!-- TOP BAR -->
        <header class="topbar">
            <div class="about-tag">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <circle cx="8" cy="8" r="6.5" stroke="#444" stroke-width="1.3" />
                    <line x1="8" y1="3" x2="8" y2="13" stroke="#444" stroke-width="1.3" stroke-linecap="round" />
                    <line x1="3" y1="8" x2="13" y2="8" stroke="#444" stroke-width="1.3" stroke-linecap="round" />
                </svg>
                About Me
            </div>
            <h1 class="page-title">Portfolio<span class="title-arrow">↗</span></h1>
        </header>

        <!-- BENTO GRID
         Columns: [bio] [projects] [awards-wide] [awards-wide]
         Row 1:    bio   projects   awards(span2)
         Row 2:    bio   clients    orb            global-awards
    -->
        <div class="bento">

            <!-- CARD 1: BIO — col1, row1+2 -->
            <div class="card bio-card">
                <span class="cbracket cbracket-dark"></span>

                <div class="bio-avatar-wrap">
                    <div class="bio-avatar">
                        <svg viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg">
                            <!-- body -->
                            <path d="M5 130 Q10 90 30 82 Q44 76 60 76 Q76 76 90 82 Q110 90 115 130Z" fill="#b0a0b8" />
                            <!-- neck -->
                            <rect x="51" y="66" width="18" height="14" rx="3" fill="#c4b2c4" />
                            <!-- head -->
                            <ellipse cx="60" cy="46" rx="27" ry="29" fill="#ccc" />
                            <!-- face skin -->
                            <ellipse cx="60" cy="48" rx="22" ry="24" fill="#d8ccd8" />
                            <!-- hair top -->
                            <ellipse cx="60" cy="22" rx="27" ry="14" fill="#888" />
                            <!-- hair sides -->
                            <ellipse cx="35" cy="38" rx="11" ry="20" fill="#888" />
                            <ellipse cx="85" cy="38" rx="11" ry="20" fill="#888" />
                            <!-- ear left -->
                            <ellipse cx="32" cy="48" rx="5" ry="7" fill="#d0c0d0" />
                            <!-- ear right -->
                            <ellipse cx="88" cy="48" rx="5" ry="7" fill="#d0c0d0" />
                            <!-- glasses left -->
                            <rect x="37" y="43" width="17" height="12" rx="5.5" fill="none" stroke="#666"
                                stroke-width="2" />
                            <!-- glasses right -->
                            <rect x="66" y="43" width="17" height="12" rx="5.5" fill="none" stroke="#666"
                                stroke-width="2" />
                            <!-- glasses bridge -->
                            <line x1="54" y1="48" x2="66" y2="48" stroke="#666" stroke-width="1.5" />
                            <!-- glasses arms -->
                            <line x1="27" y1="47" x2="37" y2="47" stroke="#666" stroke-width="1.5" />
                            <line x1="83" y1="47" x2="93" y2="47" stroke="#666" stroke-width="1.5" />
                            <!-- mustache -->
                            <path d="M48 62 Q53 66 60 63 Q67 66 72 62" stroke="#888" stroke-width="2.8" fill="none"
                                stroke-linecap="round" />
                        </svg>
                    </div>
                </div>

                <div class="bio-body">
                    <h2 class="bio-name">Im,<br />Jon<br />Daniel</h2>
                    <div class="bio-row">
                        <div class="badge-wrap">
                            <svg class="badge-svg" viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <defs>
                                    <path id="cp" d="M45,45 m-32,0 a32,32 0 1,1 64,0 a32,32 0 1,1 -64,0" />
                                </defs>
                                <circle cx="45" cy="45" r="38" stroke="rgba(255,255,255,0.35)" stroke-width="1"
                                    stroke-dasharray="3 4" />
                                <text font-size="7.5" fill="rgba(255,255,255,0.8)" font-family="DM Sans,sans-serif"
                                    font-weight="500" letter-spacing="2">
                                    <textPath href="#cp">2022 DESIGN PORTFOLIO • 2022 DESIGN PORTFOLIO •</textPath>
                                </text>
                                <circle cx="45" cy="45" r="10" fill="rgba(255,255,255,0.12)" />
                                <circle cx="45" cy="45" r="5" fill="white" />
                            </svg>
                        </div>
                    </div>
                    <div class="bio-email">
                        <span>inquiry@jondaniel.design</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.75)"
                            stroke-width="1.8" stroke-linecap="round">
                            <rect x="2" y="4" width="20" height="16" rx="2.5" />
                            <path d="M2 7l10 6.5L22 7" />
                        </svg>
                    </div>
                </div>
            </div>

            <!-- CARD 2: 251 Projects — col2, row1 -->
            <div class="card stat-card teal-card">
                <span class="cbracket cbracket-dark"></span>
                <div class="stat-num">251</div>
                <div class="stat-lbl">Projects</div>
            </div>

            <!-- CARD 3: 156 Awards — col3+4, row1 (WIDE) -->
            <div class="card stat-card purple-card">
                <span class="cbracket cbracket-dark"></span>
                <div class="stat-num">156</div>
                <div class="stat-lbl">Awards</div>
            </div>

            <!-- CARD 4: Apple Clients — col2, row2 -->
            <div class="card dark-card clients-card">
                <span class="cbracket cbracket-light"></span>
                <svg class="apple-svg" viewBox="0 0 24 24" fill="white">
                    <path
                        d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z" />
                </svg>
                <p class="clients-lbl">Clients</p>
            </div>

            <!-- CARD 5: Orb — col3, row2 -->
            <div class="card dark-card orb-card">
                <span class="cbracket cbracket-light"></span>
                <div class="orb">
                    <div class="orb-inner"></div>
                    <div class="orb-glint"></div>
                </div>
            </div>

            <!-- CARD 6: 172 Global Design Awards — col4, row2 -->
            <div class="card yellow-card">
                <span class="cbracket cbracket-dark"></span>
                <div class="stat-num awards-num">172</div>
                <div class="stat-lbl awards-lbl">Global Design<br />Awards.</div>
            </div>

        </div><!-- /bento -->
    </div><!-- /page -->

</body>

</html>
